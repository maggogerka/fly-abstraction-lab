name: Reproducibility checks

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-cpu.lock
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest
      - run: python -m fly_abstraction doctor
      - run: python -m fly_abstraction --profile smoke_cpu show-config
      - run: python -m fly_abstraction --profile smoke_cpu train
      - run: python -m fly_abstraction --profile pilot_gpu show-config
      - run: python -m fly_abstraction --profile pilot_gpu train
      - run: python -m fly_abstraction data download deepmind_mathematics
      - run: python -m fly_abstraction data download flywire_fafb_v783
      - run: python -m fly_abstraction --profile flywire_smoke_gpu show-config
      - run: python -m fly_abstraction --profile flywire_smoke_gpu train

  docker-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config --quiet
      - run: docker buildx build --check --file Dockerfile.cpu .
      - run: docker buildx build --check --file Dockerfile.gpu .

