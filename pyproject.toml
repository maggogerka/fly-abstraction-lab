[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-abstraction"
version = "0.1.0"
description = "Connectome-constrained systematic generalization research platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [{name = "maggogerka"}]
dependencies = [
  "numpy>=1.26,<3",
  "psutil>=5.9,<8",
  "PyYAML>=6.0,<7",
  "sympy>=1.12,<2",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
parquet = ["pandas>=2.2,<3", "pyarrow>=16,<22"]

[project.scripts]
fly-abstraction = "fly_abstraction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

